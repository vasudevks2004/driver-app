name: hired_driver
description: HireD driver staffing app for Android and iOS.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  file_picker: ^8.3.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  google_sign_in: 7.2.0
  url_launcher: 6.3.2
  realtime_client: 2.13.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/hired-logo.svg
    - assets/google-g.svg

