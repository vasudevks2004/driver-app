name: Driver app checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Save build files (uses Actions artifact storage)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_hiredApplicationId: com.hired.hired_driver.staging
      ORG_GRADLE_PROJECT_hiredAppName: HireD Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter 3.35.7
        run: |
          git init "$RUNNER_TEMP/hired-flutter"
          git -C "$RUNNER_TEMP/hired-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/hired-flutter" fetch --depth 1 origin adc901062556672b4138e18a4dc62a4be8f4b3c2
          git -C "$RUNNER_TEMP/hired-flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/hired-flutter" tag 3.35.7 adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/hired-flutter/bin" >> "$GITHUB_PATH"
      - name: Validate release metadata and environment separation
        run: python3 scripts/check_driver_release.py
      - run: flutter pub get
      - name: Save resolved dependency lock
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-dependency-lock
          path: pubspec.lock
          retention-days: 7
      - name: Enforce Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Enforce analyzer and lint results
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test driver flows and render UI previews
        run: flutter test
        env:
          HIRED_UI_PREVIEWS: '1'
          HIRED_FLUTTER_ROOT: ${{ runner.temp }}/hired-flutter
      - name: Save rendered app screens
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Select supported JDK 17 for Android Gradle
        run: flutter config --jdk-dir "$JAVA_HOME_17_X64"
      - name: Build Android debug app
        run: flutter build apk --debug --dart-define-from-file=config/staging.json
      - name: Save Android debug app
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hired-driver-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Check onboarding service types
        run: npx --yes deno@2.9.6 check supabase/functions/driver-onboarding/index.ts supabase/functions/send-sms-msg91/index.ts
      - name: Test onboarding service over HTTP stand-ins
        run: npx --yes node@24.22.1 --experimental-strip-types --test supabase/functions/driver-onboarding/service.test.mjs supabase/functions/send-sms-msg91/service.test.mjs

  android-device:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.head_ref == 'test/hosted-staging-20261027' || startsWith(github.head_ref, 'chore/align-driver-')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter
        run: |
          git init "$RUNNER_TEMP/hired-flutter"
          git -C "$RUNNER_TEMP/hired-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/hired-flutter" fetch --depth 1 origin adc901062556672b4138e18a4dc62a4be8f4b3c2
          git -C "$RUNNER_TEMP/hired-flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/hired-flutter" tag 3.35.7 adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/hired-flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare native app
        run: |
          flutter config --jdk-dir "$JAVA_HOME_17_X64"
          flutter pub get
      - name: Boot Android 35 emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/hired-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name hired-test --path "$ANDROID_AVD_HOME/hired-test.avd" --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/hired-test.ini"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd hired-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/hired-emulator.log" 2>&1 &
          timeout 120s adb wait-for-device || { cat "$RUNNER_TEMP/hired-emulator.log"; exit 1; }
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
      - name: Native preview smoke test
        run: flutter test integration_test/device_smoke_test.dart -d emulator-5554
      - name: Print emulator diagnostics
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/hired-emulator.log" || true
